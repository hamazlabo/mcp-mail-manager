# PR 時の検証。AWS 資格情報は不要。
name: ci

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ビルド (dist/mcp/main.js — Dockerfile が参照する)
        run: npm run build
      - name: ユニットテスト
        run: npm test
      - name: CDK synth
        run: npx cdk synth --context stage=dev --quiet
