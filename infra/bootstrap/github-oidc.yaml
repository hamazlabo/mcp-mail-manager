AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GitHub Actions 用の OIDC プロバイダと CDK デプロイロール（mcp-mail-manager）。
  dev / prod の各アカウントに 1 回だけ適用する。
  例: aws cloudformation deploy --template-file infra/bootstrap/github-oidc.yaml --stack-name github-oidc-deploy
        --capabilities CAPABILITY_NAMED_IAM --parameter-overrides Branch=develop EnvironmentName=dev --profile <profile>

Parameters:
  GitHubRepo:
    Type: String
    Default: hamazlabo/mcp-mail-manager
    Description: <owner>/<repo>
  Branch:
    Type: String
    AllowedValues: [develop, main]
    Description: このアカウントへデプロイするブランチ（dev=develop, prod=main）
  EnvironmentName:
    Type: String
    AllowedValues: [dev, production]
    Description: ワークフローの environment 名。job が environment を持つと OIDC の sub が environment:<name> になる
  CdkQualifier:
    Type: String
    Default: hnb659fds

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-deploy-${EnvironmentName}
      # IAM Role の Description は ASCII / Latin-1 のみ（日本語は CREATE_FAILED になる）
      Description: !Sub GitHub Actions (${GitHubRepo}@${Branch}) CDK deploy role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/${Branch}
                  - !Sub repo:${GitHubRepo}:environment:${EnvironmentName}
      Policies:
        - PolicyName: cdk-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CDK ブートストラップロール（deploy / file-publishing / image-publishing / lookup）の引受け
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-*-role-${AWS::AccountId}-${AWS::Region}
              # AgentCore Runtime のサービスリンクロール作成（design.md 9 章）
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: bedrock-agentcore.amazonaws.com

Outputs:
  RoleArn:
    Description: Repository variable AWS_DEV_ROLE_ARN / AWS_PROD_ROLE_ARN に設定する値
    Value: !GetAtt DeployRole.Arn
